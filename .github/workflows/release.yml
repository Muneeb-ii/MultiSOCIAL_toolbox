name: Build Releases

env:
  UPSTREAM_REPOSITORY: Tahiya31/MultiSOCIAL_toolbox
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      run_windows_complete_e2e:
        description: Run the secret-backed Windows Complete diarization smoke test.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'Tahiya31/MultiSOCIAL_toolbox') }}
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      should_publish_release: ${{ steps.meta.outputs.should_publish_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Derive and validate release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(python -c "import re; from pathlib import Path; print(re.search(r'^version\\s*=\\s*\"([^\"]+)\"', Path('pyproject.toml').read_text(), re.M).group(1))")"
          release_tag="v${app_version}"
          should_publish="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_REPOSITORY}" == "${UPSTREAM_REPOSITORY}" ]]; then
            should_publish="true"
            if gh release view "${release_tag}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              echo "Release or tag ${release_tag} already exists. Bump pyproject.toml before merging to main." >&2
              exit 1
            fi
          fi
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "should_publish_release=${should_publish}" >> "${GITHUB_OUTPUT}"

  macos-build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, complete]
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      MULTISOCIAL_BUILD_PROFILE: ${{ matrix.profile }}
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install macOS build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==80.10.2"
          if [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]]; then
            python -m pip install ".[complete,dev]"
          else
            python -m pip install ".[dev]"
          fi

      - name: Build unchanged in-process macOS application
        env:
          MPLCONFIGDIR: ${{ github.workspace }}/.tmp/macos-mpl-${{ matrix.profile }}
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.tmp/macos-pyi-${{ matrix.profile }}
        run: pyinstaller --clean --noconfirm MultiSOCIAL.spec

      - name: Validate and smoke-test macOS application
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          app_path="dist/${app_name}.app"
          link="${app_path}/Contents/Frameworks/Python.framework/Versions/Current"
          test -d "${app_path}"
          test -L "${link}"
          expected="${APP_VERSION}"
          actual="$(plutil -extract CFBundleShortVersionString raw "${app_path}/Contents/Info.plist")"
          test "${actual}" = "${expected}"
          MULTISOCIAL_IMPORT_SMOKE_TEST=1 MULTISOCIAL_VERIFY_HEAVY_POSE_ASSET=1 \
            "${app_path}/Contents/MacOS/${app_name}"
          python .github/scripts/validate_complete_bundle_layout.py

      - name: Archive macOS application
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          mkdir -p release-artifacts workflow-artifacts
          ditto -c -k --sequesterRsrc --keepParent "dist/${app_name}.app" \
            "release-artifacts/${app_name}-macos.zip"
          cp -R "dist/${app_name}.app" workflow-artifacts/
          cp "release-artifacts/${app_name}-macos.zip" workflow-artifacts/

      - uses: actions/upload-artifact@v5
        with:
          name: MultiSOCIAL-${{ env.APP_VERSION }}-${{ matrix.profile }}-${{ runner.os }}
          path: workflow-artifacts/*

  windows-build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, complete]
        repetition: [1, 2, 3]
    runs-on: windows-2025
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      MULTISOCIAL_BUILD_PROFILE: ${{ matrix.profile }}
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.tmp/pycache-${{ matrix.profile }}-${{ matrix.repetition }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Verify committed Windows packaging inputs
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch \
            packaging/windows_gui.spec \
            packaging/windows_worker.spec
          test -f packaging/windows_gui.spec
          test -f packaging/windows_worker.spec

      - name: Create physically separate GUI and worker environments
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-gui
          python -m venv .venv-worker
          .venv-gui/Scripts/python.exe -m pip install --require-hashes --no-deps \
            -r requirements/locks/windows-gui-py310.txt
          .venv-worker/Scripts/python.exe -m pip install --require-hashes --no-deps \
            -r "requirements/locks/windows-${MULTISOCIAL_BUILD_PROFILE}-py310.txt"

      - name: Audit dependency ownership before analysis
        shell: bash
        run: |
          set -euo pipefail
          .venv-gui/Scripts/python.exe packaging/audit_windows_environment.py --kind gui
          .venv-worker/Scripts/python.exe packaging/audit_windows_environment.py --kind worker

      - name: Build native-free Windows GUI
        shell: bash
        env:
          MPLCONFIGDIR: ${{ github.workspace }}/.tmp/gui-mpl-${{ matrix.repetition }}
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.tmp/gui-pyi-${{ matrix.repetition }}
        run: |
          set -euo pipefail
          .venv-gui/Scripts/python.exe -m PyInstaller --clean --noconfirm \
            --workpath ".tmp/gui-work-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}" \
            --distpath ".tmp/gui-dist-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}" \
            packaging/windows_gui.spec

      - name: Build private Windows worker in a separate process
        shell: bash
        env:
          MPLCONFIGDIR: ${{ github.workspace }}/.tmp/worker-mpl-${{ matrix.repetition }}
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.tmp/worker-pyi-${{ matrix.repetition }}
        run: |
          set -euo pipefail
          .venv-worker/Scripts/python.exe -m PyInstaller --clean --noconfirm \
            --workpath ".tmp/worker-work-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}" \
            --distpath ".tmp/worker-dist-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}" \
            packaging/windows_worker.spec

      - name: Assemble opaque worker runtime under GUI runtime
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          python packaging/assemble_windows.py \
            --gui ".tmp/gui-dist-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}/${app_name}" \
            --worker ".tmp/worker-dist-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}/MultiSOCIAL-Worker" \
            --output "dist/${app_name}"
          python packaging/validate_windows_bundle.py --root "dist/${app_name}" \
            --profile "${MULTISOCIAL_BUILD_PROFILE}"
          python .github/scripts/validate_complete_bundle_layout.py

      - name: Run GUI-to-worker isolated launch and ten cold probes
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          gui="dist/${app_name}/${app_name}.exe"
          worker="dist/${app_name}/worker/MultiSOCIAL-Worker.exe"
          MULTISOCIAL_IMPORT_SMOKE_TEST=1 MULTISOCIAL_VERIFY_HEAVY_POSE_ASSET=1 \
            MULTISOCIAL_VERIFY_WORKER_LAUNCH=1 "${gui}"
          for attempt in $(seq 1 10); do
            printf '%s\n' '{"protocol":1,"id":"probe-'"${attempt}"'","type":"run","operation":"probe","payload":{"profile":"'"${MULTISOCIAL_BUILD_PROFILE}"'"}}' |
              "${worker}" |
              python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m; r=m[-1]['result']['runtime']['worker_runtime']; assert r['private_runtime'] and not r['loaded_module_violations'],r"
          done

      - name: Exercise packaged audio and pose native paths
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          worker="dist/${app_name}/worker/MultiSOCIAL-Worker.exe"
          mkdir -p .tmp/runtime-fixtures/features .tmp/runtime-fixtures/pose .tmp/runtime-fixtures/embed
          python -c "import math,wave; p='.tmp/runtime-fixtures/tone.wav'; w=wave.open(p,'w'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b''.join(int(1000*math.sin(2*math.pi*220*i/16000)).to_bytes(2,'little',signed=True) for i in range(16000))); w.close()"
          .venv-worker/Scripts/python.exe -c "import cv2,numpy as np; w=cv2.VideoWriter('.tmp/runtime-fixtures/blank.avi',cv2.VideoWriter_fourcc(*'MJPG'),10,(160,120)); [w.write(np.zeros((120,160,3),dtype=np.uint8)) for _ in range(10)]; w.release()"
          printf '%s\n' '{"protocol":1,"id":"features","type":"run","operation":"extract_audio_features","payload":{"audio_files":[".tmp/runtime-fixtures/tone.wav"],"output_audio_features_folder":".tmp/runtime-fixtures/features"}}' |
            "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m"
          test -f .tmp/runtime-fixtures/features/tone.csv
          mkdir -p .tmp/runtime-fixtures/cancelled
          printf '%s\n' \
            '{"protocol":1,"id":"cancel","type":"run","operation":"extract_audio_features","payload":{"audio_files":[".tmp/runtime-fixtures/tone.wav",".tmp/runtime-fixtures/tone.wav"],"output_audio_features_folder":".tmp/runtime-fixtures/cancelled"}}' \
            '{"protocol":1,"id":"cancel","type":"cancel"}' |
            "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m; assert m[-1]['result']['cancelled'],m"
          test -z "$(find .tmp/runtime-fixtures/cancelled -type f -print -quit)"
          for mode in false true; do
            printf '%s\n' '{"protocol":1,"id":"pose-'"${mode}"'","type":"run","operation":"extract_pose","payload":{"video_files":[".tmp/runtime-fixtures/blank.avi"],"output_csv_folder":".tmp/runtime-fixtures/pose","multi_person":'"${mode}"'}}' |
              "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m"
          done
          printf '%s\n' '{"protocol":1,"id":"embed","type":"run","operation":"embed_pose","payload":{"video_files":[".tmp/runtime-fixtures/blank.avi"],"output_csv_folder":".tmp/runtime-fixtures/pose","output_video_folder":".tmp/runtime-fixtures/embed","multi_person":false}}' |
            "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m"

      - name: Run canonical packaged Whisper ASR
        if: matrix.repetition == 1
        shell: bash
        env:
          MULTISOCIAL_WHISPER_MODEL_ID: openai/whisper-tiny
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          worker="dist/${app_name}/worker/MultiSOCIAL-Worker.exe"
          mkdir -p .tmp/whisper/transcripts
          printf '%s\n' '{"protocol":1,"id":"whisper","type":"run","operation":"extract_transcripts","payload":{"audio_files":[".tmp/runtime-fixtures/tone.wav"],"output_transcripts_folder":".tmp/whisper/transcripts","word_timestamps":false,"enable_diarization":false}}' |
            "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m; assert not m[-1]['result']['failed'],m"

      - name: Run optional Complete diarization E2E
        if: matrix.repetition == 1 && matrix.profile == 'complete' && (needs.prepare.outputs.should_publish_release == 'true' || inputs.run_windows_complete_e2e)
        shell: bash
        env:
          MULTISOCIAL_CI_HF_TOKEN: ${{ secrets.MULTISOCIAL_CI_HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MULTISOCIAL_CI_HF_TOKEN}"
          worker="dist/MultiSOCIAL-Complete/worker/MultiSOCIAL-Worker.exe"
          mkdir -p .tmp/diarization/transcripts
          export MULTISOCIAL_WORKER_HF_TOKEN="${MULTISOCIAL_CI_HF_TOKEN}"
          printf '%s\n' '{"protocol":1,"id":"e2e","type":"run","operation":"extract_transcripts","payload":{"audio_files":[".tmp/runtime-fixtures/tone.wav"],"output_transcripts_folder":".tmp/diarization/transcripts","word_timestamps":false,"enable_diarization":true}}' |
            "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m"

      - name: Archive canonical Windows build
        if: matrix.repetition == 1
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          mkdir -p release-artifacts workflow-artifacts
          python -c "import shutil; shutil.make_archive('release-artifacts/${app_name}-windows','zip',root_dir='dist',base_dir='${app_name}')"
          cp -R "dist/${app_name}" workflow-artifacts/
          cp "release-artifacts/${app_name}-windows.zip" workflow-artifacts/

      - name: Upload canonical Windows workflow artifact
        if: matrix.repetition == 1
        uses: actions/upload-artifact@v5
        with:
          name: MultiSOCIAL-${{ env.APP_VERSION }}-${{ matrix.profile }}-${{ runner.os }}
          path: workflow-artifacts/*

  windows-client-compat:
    needs: [prepare, windows-build]
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, complete]
    runs-on: windows-2022
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      MULTISOCIAL_BUILD_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v5
        with:
          name: MultiSOCIAL-${{ env.APP_VERSION }}-${{ matrix.profile }}-Windows
          path: .tmp/download

      - name: Relocate bundle to an installation-like path
        shell: pwsh
        run: |
          $installRoot = Join-Path $PWD ".tmp\Installed Apps\Üser Validation"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          Get-ChildItem ".tmp\download" | Copy-Item -Destination $installRoot -Recurse
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run downloaded GUI launch, worker probes, and audio smoke
        shell: bash
        env:
          MULTISOCIAL_WHISPER_MODEL_ID: openai/whisper-tiny
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          gui="$(find "${INSTALL_ROOT}" -name "${app_name}.exe" -type f -print -quit)"
          worker="$(find "${INSTALL_ROOT}" -name MultiSOCIAL-Worker.exe -type f -print -quit)"
          test -n "${gui}" && test -n "${worker}"
          MULTISOCIAL_IMPORT_SMOKE_TEST=1 MULTISOCIAL_VERIFY_HEAVY_POSE_ASSET=1 \
            MULTISOCIAL_VERIFY_WORKER_LAUNCH=1 "${gui}"
          for attempt in $(seq 1 10); do
            printf '%s\n' '{"protocol":1,"id":"compat-'"${attempt}"'","type":"run","operation":"probe","payload":{"profile":"'"${MULTISOCIAL_BUILD_PROFILE}"'"}}' |
              "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m"
          done
          mkdir -p .tmp/compat/features
          python -c "import math,wave; w=wave.open('.tmp/compat/tone.wav','w'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b''.join(int(1000*math.sin(2*math.pi*220*i/16000)).to_bytes(2,'little',signed=True) for i in range(16000))); w.close()"
          printf '%s\n' '{"protocol":1,"id":"features","type":"run","operation":"extract_audio_features","payload":{"audio_files":[".tmp/compat/tone.wav"],"output_audio_features_folder":".tmp/compat/features"}}' |
            "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m"
          test -f .tmp/compat/features/tone.csv
          mkdir -p .tmp/compat/cancelled .tmp/compat/pose .tmp/compat/transcripts
          printf '%s\n' \
            '{"protocol":1,"id":"cancel","type":"run","operation":"extract_audio_features","payload":{"audio_files":[".tmp/compat/tone.wav",".tmp/compat/tone.wav"],"output_audio_features_folder":".tmp/compat/cancelled"}}' \
            '{"protocol":1,"id":"cancel","type":"cancel"}' |
            "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result' and m[-1]['result']['cancelled'],m"
          test -z "$(find .tmp/compat/cancelled -type f -print -quit)"
          ffmpeg="$(find "$(dirname "${worker}")" -iname 'ffmpeg*.exe' -type f -print -quit)"
          test -n "${ffmpeg}"
          "${ffmpeg}" -y -f lavfi -i color=c=black:s=160x120:d=1 -r 10 .tmp/compat/blank.avi
          for mode in false true; do
            printf '%s\n' '{"protocol":1,"id":"pose-'"${mode}"'","type":"run","operation":"extract_pose","payload":{"video_files":[".tmp/compat/blank.avi"],"output_csv_folder":".tmp/compat/pose","multi_person":'"${mode}"'}}' |
              "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result',m"
          done
          printf '%s\n' '{"protocol":1,"id":"whisper","type":"run","operation":"extract_transcripts","payload":{"audio_files":[".tmp/compat/tone.wav"],"output_transcripts_folder":".tmp/compat/transcripts","word_timestamps":false,"enable_diarization":false}}' |
            "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result' and not m[-1]['result']['failed'],m"

      - name: Run qualified Complete diarization after relocation
        if: matrix.profile == 'complete' && (needs.prepare.outputs.should_publish_release == 'true' || inputs.run_windows_complete_e2e)
        shell: bash
        env:
          MULTISOCIAL_CI_HF_TOKEN: ${{ secrets.MULTISOCIAL_CI_HF_TOKEN }}
          MULTISOCIAL_WHISPER_MODEL_ID: openai/whisper-tiny
        run: |
          set -euo pipefail
          test -n "${MULTISOCIAL_CI_HF_TOKEN}"
          worker="$(find "${INSTALL_ROOT}" -name MultiSOCIAL-Worker.exe -type f -print -quit)"
          mkdir -p .tmp/compat/diarized
          export MULTISOCIAL_WORKER_HF_TOKEN="${MULTISOCIAL_CI_HF_TOKEN}"
          printf '%s\n' '{"protocol":1,"id":"diarization","type":"run","operation":"extract_transcripts","payload":{"audio_files":[".tmp/compat/tone.wav"],"output_transcripts_folder":".tmp/compat/diarized","word_timestamps":false,"enable_diarization":true}}' |
            "${worker}" | python -c "import json,sys; m=[json.loads(x) for x in sys.stdin if x.strip()]; assert m[-1]['event']=='result' and not m[-1]['result']['failed'],m"

  publish:
    if: needs.prepare.outputs.should_publish_release == 'true'
    needs: [prepare, macos-build, windows-build, windows-client-compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: MultiSOCIAL-${{ needs.prepare.outputs.app_version }}-*
          path: qualified-artifacts
          merge-multiple: true
      - name: Create qualified release and upload four assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: qualified-artifacts/*.zip
